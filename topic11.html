let bv=null;function ldv(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();if(!vs.length)return;['Microsoft Aria Online','Google US English','Samantha','Microsoft Zira'].some(p=>{const f=vs.find(x=>x.name.includes(p));if(f){bv=f;return true}});if(!bv)bv=vs.find(x=>x.lang==='en-US')||vs[0]}

function say(t,r=0.9, onEndCb=null){
    if(!t)return;

    t = t.replace(/^(Sarah|Rose):\s*['"]?|['"]?$/g, '').trim();

        responsiveVoice.cancel();

        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(t);
        u.lang='en-US'; u.rate=r; if(bv)u.voice=bv;
        if(onEndCb) u.onend = onEndCb;
        speechSynthesis.speak(u);
    } else {
        if(onEndCb) onEndCb();
    }
}

function initLA() {
    let text = storyLines[laIdx].en.replace(/^(Sarah|Rose):\s*['"]?|['"]?$/g, '').trim();
    let words = text.match(/[\p{L}0-9_’'-]+/gu) || [];
    laPool = shuffle(words.map((w, i) => ({id: i, text: w})));
    laSelected = [];
    laFb = null;
}
function moveLA(id, toSelected) {
    if(toSelected) {
        let item = laPool.find(x => x.id === id);
        if(item) { laPool = laPool.filter(x => x.id !== id); laSelected.push(item); }
    } else {
        let item = laSelected.find(x => x.id === id);
        if(item) { laSelected = laSelected.filter(x => x.id !== id); laPool.push(item); }
    }
    R();
}
function checkLA() {
    let original = storyLines[laIdx].en.replace(/^(Sarah|Rose):\s*['"]?|['"]?$/g, '').trim();
    let current = laSelected.map(b => b.text).join(' ');
    laFb = (norm(original) === norm(current));
    R();
}

    pool.forEach(v=>{cards.push({id:v.id, type:'en', text:v.en}); cards.push({id:v.id, type:'vi', text:v.vi});});

}

// UPDATE: initLR to reset feedback states and handle timeout feedback
function initLR(){
    clearInterval(lrTimer);
    lrFb = null;
    lrClicked = null;
    lrWord = V[Math.floor(Math.random() * V.length)];
    let others = shuffle(V.filter(v => v.id !== lrWord.id)).slice(0, 3);
    lrOpts = shuffle([lrWord, ...others]);
    lrTimeLeft = 5;
    
    lrTimer = setInterval(() => {
        lrTimeLeft--;
        if(lrTimeLeft <= 0) { 
            clearInterval(lrTimer); 
            lrFb = false; // Báo sai khi hết giờ
            R();
            setTimeout(() => { nextLR(); }, 1500); 
        } else {
            R();
        }
    }, 1000);
    say(lrWord.en);
    R();
}

// UPDATE: checkLR to evaluate score, set feedback states, and wait before next question
function checkLR(id) {
    if (lrFb !== null) return; // Prevent clicking again if already answered
    clearInterval(lrTimer);
    lrClicked = id;
    lrFb = (id === lrWord.id);
    if(lrFb) lrScore++;
    R();
    setTimeout(() => { nextLR(); }, 1500);
}
function nextLR() {
    initLR();
}

function toggleMic(){
    if(micRec){
        if(micMR && micMR.state==='recording') micMR.stop();
        if(micStream) micStream.getTracks().forEach(t=>t.stop());
        micRec = false; R(); return;
    }
    micAudioUrl = null; micChunks = [];
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
        micStream = stream; const mr = new MediaRecorder(stream); micMR = mr;
        mr.ondataavailable = e => { if(e.data.size>0) micChunks.push(e.data) };
        mr.onstop = () => {const blob = new Blob(micChunks, {type:'audio/webm'}); micAudioUrl = URL.createObjectURL(blob); micStream?.getTracks().forEach(t=>t.stop()); micStream = null; micMR = null; R();};
        mr.start(); micRec = true; R();
    }).catch(()=>{alert('Không thể truy cập microphone.'); micRec=false; R();});
}

                        ${pqA[i] === q.a ? '✅ Đúng rồi! ' : '❌ Sai rồi! '}${q.exp}
                    </div>
                </div>
            `).join('')}

            <h2 style="color:var(--pri);font-size:1.6rem;margin-top:3rem;margin-bottom:1.5rem;border-bottom:2px solid var(--brd);padding-bottom:0.5rem">Phần 2: Key Structures Check</h2>
            ${KSQ.map((q, i) => `
                <div style="margin-bottom:2rem; padding-bottom:1.5rem; border-bottom:1px dashed var(--brd)">
                    <p style="font-weight:800; font-size:1.15rem; margin-bottom:1rem">${i+1}. ${q.q}</p>
                    <div style="display:flex; flex-direction:column; gap:0.5rem; max-width:700px;">
                        ${q.o.map((opt, oi) => `
                            <button class="opt ${ksqA[i] !== undefined ? (oi === q.a ? 'ok' : (ksqA[i] === oi ? 'no' : '')) : ''}" 
                                    ${ksqA[i] !== undefined ? 'disabled' : ''} 
                                    onclick="ksqA[${i}]=${oi};R()">
                                ${String.fromCharCode(65+oi)}. ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div class="exp-box ${ksqA[i] !== undefined ? 'show' : ''} ${ksqA[i] === q.a ? 'exp-ok' : 'exp-no'}">
                        ${ksqA[i] === q.a ? '✅ Chính xác! ' : '❌ Sai rồi! '}${q.exp}
                    </div>
                </div>
            `).join('')}

            <div style="text-align:right">
                <button onclick="pqA={}; ksqA={}; R()" class="sub-btn" style="padding:1rem 2rem; font-size:1rem; margin-top:1rem">🔄 Làm lại tất cả bài tập</button>
            </div>
        </div>`;
    }
    
    // UPDATE: Render logic for Listen & React with Feedback styles
    else if(tab === 'game'){
        html += `<div class="card" style="text-align:center;padding:3rem 2rem">
            <div style="display:inline-flex; background:#f1f5f9; border-radius:16px; padding:0.5rem; margin-bottom:2.5rem;">
                <button onclick="gameTab='matching'; if(!gameCards.length) initGameMatching(); R()" style="padding:0.75rem 2rem; border-radius:12px; font-weight:700; background:${gameTab==='matching'?'#fff':'transparent'}; color:${gameTab==='matching'?'var(--sec)':'var(--mut)'}; box-shadow:${gameTab==='matching'?'0 2px 10px rgba(0,0,0,0.05)':'none'}">Matching</button>
                <button onclick="gameTab='react'; initLR(); R()" style="padding:0.75rem 2rem; border-radius:12px; font-weight:700; background:${gameTab==='react'?'#fff':'transparent'}; color:${gameTab==='react'?'var(--sec)':'var(--mut)'}; box-shadow:${gameTab==='react'?'0 2px 10px rgba(0,0,0,0.05)':'none'}">Listen & React</button>
            </div>`;

        if(gameTab === 'matching'){
            if(!gameCards.length) initGameMatching();
            html += `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
                    <h2 style="font-size:1.8rem;color:var(--sec);font-weight:800">🎮 Matching Game</h2>
                    <button onclick="initGameMatching();R()" class="sub-btn">🔄 Chơi lại</button>
                </div>
                <p style="color:var(--mut);margin-bottom:2.5rem">Ghép nối đúng từ tiếng Anh với nghĩa tiếng Việt!</p>
                <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:1.25rem">
                    ${gameCards.map((c, i)=>`<div onclick="handleGameClick(${i})" class="game-card ${gameSelected.includes(i)?'selected':''} ${gameMatched.includes(i)?'matched':''}">${c.text}</div>`).join('')}
                </div>
                ${gameMatched.length === gameCards.length ? `<div style="margin-top:3rem;padding:2rem;background:#ecfdf5;border-radius:24px;color:#047857;font-weight:800;font-size:1.5rem">🎉 Tuyệt vời! Bạn đã hoàn thành!</div>` : ''}
            `;
        } else {
            if(!lrWord) initLR();
            html += `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
                    <h2 style="font-size:1.8rem;color:var(--pri);font-weight:800">⚡ Listen & React</h2>
                    <div style="font-weight:800; font-size:1.2rem; color:var(--warn)">Điểm: ${lrScore}</div>
                </div>
                <p style="color:var(--mut);margin-bottom:2rem">Nghe âm thanh và chọn tốc độ nghĩa tương ứng trong 5 giây!</p>
                
                <div style="font-size:3rem; font-weight:800; color:${lrTimeLeft <= 2 ? 'var(--err)' : 'var(--pri)'}; margin-bottom:2rem;">⏳ ${lrTimeLeft}s</div>
                
                <button onclick="say('${esc(lrWord.en)}')" style="padding:1rem 2.5rem;border-radius:24px;font-weight:800;font-size:1.2rem;color:var(--pri);background:rgba(244,63,94,.1);margin-bottom:2.5rem" ${lrFb !== null ? 'disabled' : ''}>
                    🔊 Nghe lại từ này
                </button>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;max-width:700px;margin:0 auto">
                    ${lrOpts.map((opt) => {
                        let btnStyle = 'padding:1.5rem; border-radius:16px; border:2px solid var(--brd); background:#fff; font-weight:700; font-size:1.1rem; color:var(--text); transition:all 0.2s;';
                        if (lrFb !== null) {
                            if (opt.id === lrWord.id) {
                                btnStyle = 'padding:1.5rem; border-radius:16px; border:2px solid var(--suc); background:#ecfdf5; font-weight:700; font-size:1.1rem; color:var(--suc);';
                            } else if (opt.id === lrClicked && !lrFb) {
                                btnStyle = 'padding:1.5rem; border-radius:16px; border:2px solid var(--err); background:#fef2f2; font-weight:700; font-size:1.1rem; color:var(--err);';
                            } else {
                                btnStyle += 'opacity:0.5;';
                            }
                        }
                        return `<button onclick="checkLR(${opt.id})" style="${btnStyle}" ${lrFb !== null ? 'disabled' : ''}>
                            ${opt.vi}
                        </button>`;
                    }).join('')}
                </div>
                
                ${lrFb !== null ? `<div style="margin-top:2rem; font-weight:800; font-size:1.3rem; color:${lrFb ? 'var(--suc)' : 'var(--err)'}">${lrFb ? '🎉 Chính xác! +1 Điểm' : (lrClicked === null ? '⏳ Đã hết giờ!' : '❌ Rất tiếc, sai rồi!')}</div>` : ''}
            `;
        }
        html += `</div>`;
    }
    
    app.innerHTML = html;
    
    if(tab === 'flashcard' && fcM === 'type') document.getElementById('fcTypeInp')?.focus();
}

function chkFcType(){const i = document.getElementById('fcTypeInp'); tV = i ? i.value : ''; tFb = norm(tV) === norm(V[fi].en); setTimeout(()=>{if(tFb){if(fi<V.length-1){fi++; tFb=null; tV=''; R()}else{fcM='say'; fi=0; tFb=null; tV=''; R()}}}, 1200); R();}

function handleGameClick(idx){if(gameMatched.includes(idx) || gameSelected.includes(idx)) return; gameSelected.push(idx); R(); if(gameSelected.length === 2){const [i1, i2] = gameSelected; const c1 = gameCards[i1], c2 = gameCards[i2]; setTimeout(()=>{if(c1.id === c2.id && c1.type !== c2.type){gameMatched.push(i1, i2); if(c1.type === 'en') say(c1.text); else say(c2.text);} gameSelected = []; R();}, 600);}}

R();
</script>
</body>
</html>
